<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1c1c1c"><title>Pixelsmith</title>
<style>

#ob label,.dg label{display:flex;align-items:center;gap:7px;color:var(--m)}#ob output{width:26px;color:var(--t)}
select,input[type=text],input[type=number]{background:var(--d);color:var(--t);border:1px solid #000;padding:3px 5px;font:inherit}input[type=range]{accent-color:var(--a);width:100px}
#tb{background:var(--p);border-right:1px solid #000;display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;overflow:auto}
.tl{width:34px;height:30px;display:grid;place-items:center;border-radius:3px}.tl:hover{background:var(--p2)}.tl.on{background:var(--a);color:#fff}

#sw{position:relative;width:38px;height:42px;margin-top:10px}#sw input{position:absolute;width:24px;height:24px;padding:0;border:1px solid #000;background:none}
#fgc{left:0;top:0;z-index:2}#bgc{right:0;bottom:0}input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0}
#cv{position:relative;overflow:hidden;background:#1e1e1e}

#tp button{background:var(--p2);color:var(--t);border:0;padding:4px 8px;border-radius:3px;font:inherit}#tp button:hover{background:var(--a);color:#fff}
.sw{width:22px;height:22px;border:1px solid #000}
#lc{display:flex;gap:8px;padding:6px 8px;align-items:center}#lc input{flex:1}

#sb{grid-column:1/4;background:var(--d);display:flex;gap:30px;padding:4px 12px;color:var(--m)}

#rd label{display:flex;align-items:center;gap:9px;padding:4px 12px}#rd label:hover{background:var(--p2)}#rd hr{border:0;border-top:1px solid #222;margin:3px 0}#rd input{accent-color:var(--a)}
.pr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 4px}.pr button{background:var(--d);color:var(--m);border:1px solid #000;border-radius:3px;padding:6px 0 5px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pr button:hover{border-color:var(--a);color:var(--t)}.pr button.on{border-color:var(--a);color:#fff;background:#243447}.pr .bx{width:28px;height:28px;display:grid;place-items:center}.pr i{display:block;border:1.5px solid currentColor;border-radius:2px}
#rf svg,#rc svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);background:var(--d);border:1px solid #000;padding:7px 14px;border-radius:4px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}#toast.on{opacity:1}
.lgw{width:76px;margin-bottom:18px}.lgw svg{display:block;width:100%;height:auto}#wl button svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

<div id="mb"></div><div id="ob"></div><div id="tb"></div>

<script>
